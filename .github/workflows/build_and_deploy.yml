name: Build and Deploy Website

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build website
        run: pnpm build

      - name: Upload to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          BUCKET: ${{ secrets.AWS_BUCKET_NAME }}
        run: |
          aws s3 sync dist "s3://$BUCKET" --delete --acl public-read

          # The CLI guesses Content-Type from the runner's MIME table, which may
          # not know newer formats. Set them explicitly so browsers and the CDN
          # get real types instead of binary/octet-stream.
          fix_type() {
            aws s3 cp "s3://$BUCKET/" "s3://$BUCKET/" --recursive \
              --exclude "*" --include "*.$1" \
              --content-type "$2" --metadata-directive REPLACE --acl public-read
          }
          fix_type avif image/avif
          fix_type webp image/webp
          fix_type woff2 font/woff2
          fix_type webmanifest application/manifest+json

      - name: Invalidate CloudFront cache
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION }}" \
            --paths "/*"
